{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Резюме соискателя</h1>
  <form method="post" class="form grid-form">
    <label>Пол
      <input name="gender" list="gender-options" value="{{ resume.gender if resume else '' }}" placeholder="Выберите или введите свой вариант">
    </label>
    <label>Дата рождения
      <input name="birth_date" type="date" value="{{ resume.birth_date if resume else '' }}">
    </label>
    <label>Город
      <input name="city" list="city-options" required value="{{ resume.city if resume else '' }}" placeholder="Выберите или введите город">
    </label>
    <label>Телефон
      <input name="phone" required value="{{ resume.phone if resume else '' }}">
    </label>
    <label>Образование
      <input name="education_level" list="education-options" required value="{{ resume.education_level if resume else '' }}" placeholder="Выберите или введите уровень">
    </label>
    <label>Специальность
      <input name="specialty" list="specialty-options" required value="{{ resume.specialty if resume else '' }}" placeholder="Выберите или введите специальность">
    </label>
    <label>Стаж, лет
      <input name="experience_years" list="experience-options" type="number" step="0.1" min="0" required value="{{ resume.experience_years if resume else 0 }}">
    </label>
    <label>Желаемая должность
      <input name="desired_position" list="position-options" required value="{{ resume.desired_position if resume else '' }}" placeholder="Выберите или введите должность">
    </label>
    <label>Желаемая зарплата
      <input name="desired_salary" list="salary-options" type="number" min="0" required value="{{ resume.desired_salary if resume else 0 }}">
    </label>
    <label>Статус поиска
      <input name="availability_status" list="availability-options" value="{{ resume.availability_status if resume else '' }}" placeholder="Активно ищу работу">
    </label>
    <label>Средний уровень навыков
      <input name="skills_level" list="skill-level-options" type="number" step="0.01" min="0" max="1" required value="{{ resume.skills_level if resume else 0.5 }}">
    </label>
    <label class="wide">Навыки
      <input id="resume-skills-value" name="skills" type="hidden" value="{{ resume.skills if resume else '' }}">
      <input data-multi-picker data-target="resume-skills-value" list="skills-options" placeholder="Выберите навык или введите свой">
      <div class="tag-list" data-tags-for="resume-skills-value"></div>
    </label>
    <label class="wide">Опыт работы
      <textarea name="work_experience" placeholder="Например: 2024-2026, Python-разработчик, разработка Flask/MySQL приложения">{{ resume.work_experience if resume else '' }}</textarea>
    </label>
    <label class="wide">История образования
      <textarea name="education_history" placeholder="Например: ОГУ, Информационные системы, 2026">{{ resume.education_history if resume else '' }}</textarea>
    </label>
    <label>Языки
      <input name="languages" list="language-options" value="{{ resume.languages if resume else '' }}" placeholder="Русский, английский B1">
    </label>
    <label>Сертификаты
      <input name="certificates" value="{{ resume.certificates if resume else '' }}" placeholder="Python, SQL, Project management">
    </label>
    <label class="wide">Портфолио и профессиональные ссылки
      <input name="portfolio_links" value="{{ resume.portfolio_links if resume else '' }}" placeholder="GitHub, сайт, проекты, LinkedIn">
    </label>
    <p class="form-hint wide">Профиль можно заполнять свободно: если нужного варианта нет в списке, просто введите свой.</p>
    <button class="button" type="submit">Сохранить</button>
  </form>
</section>

{% include "partials/form_datalists.html" %}
{% endblock %}
