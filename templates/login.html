{% extends "base.html" %}
{% block content %}
<section class="auth-shell">
  <div class="auth-visual">
    <p class="eyebrow">Secure access</p>
    <h1>Вход в цифровую платформу занятости</h1>
    <p>Персональные кабинеты для соискателей, работодателей и администратора с контролем статусов откликов.</p>
    <div class="auth-metric"><strong>100%</strong><span>откликов имеют прозрачный статус</span></div>
  </div>
  <form method="post" class="auth-card form">
    <h2>Вход</h2>
    <label>Email<input name="email" type="email" required></label>
    <label>Пароль<input name="password" type="password" required></label>
    <button class="button" type="submit">Войти</button>
  </form>
</section>
{% endblock %}
